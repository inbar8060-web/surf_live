project_id = "surfer-live"

[api]
enabled = true
port = 54321
# `app` stays off this list on purpose: RLS helpers must not be callable over HTTP.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# The app's own forms require 12 characters. The auth server must enforce the
# same floor, or a password-reset email (which never passes through the app's
# validation) would accept a six-character password.
minimum_password_length = 12
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Accounts are created by an administrator or through an invite link only.
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# Must stay TRUE: this flag is the email provider itself (GOTRUE_EXTERNAL_EMAIL_ENABLED).
# Setting it false disables email *logins* as well as signups and locks everyone
# out. Public self-registration is blocked by `enable_signup = false` under
# [auth] above, which is the flag that actually means "no open signups".
enable_signup = true
enable_confirmations = true
secure_password_change = true

[auth.sessions]
timebox = "24h"
inactivity_timeout = "8h"

[local_smtp]
enabled = true
port = 54324
